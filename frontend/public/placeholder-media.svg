<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="glowPrimary" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 100) rotate(45) scale(420)">
      <stop stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAccent" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 520) rotate(-135) scale(420)">
      <stop stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0F172A"/>
  <rect width="800" height="600" fill="url(#glowPrimary)"/>
  <rect width="800" height="600" fill="url(#glowAccent)"/>

  <rect x="1.5" y="1.5" width="797" height="597" rx="20" stroke="#1E293B" stroke-width="3"/>

  <g transform="translate(400 258)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="#1E293B" fill-opacity="0.7" stroke="url(#cardStroke)" stroke-width="1.5"/>
    <g stroke="url(#iconGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-28" y="-22" width="56" height="44" rx="6"/>
      <circle cx="-14" cy="-8" r="6"/>
      <path d="M-28 14L-6 -2L8 10L28 -6"/>
    </g>
  </g>

  <text x="400" y="358" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing="0.3">
    Image Coming Soon
  </text>
  <text x="400" y="390" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" letter-spacing="1.5">
    MANSI MAHANT PORTFOLIO
  </text>
